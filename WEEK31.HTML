<!DOCTYPE html>
<html>
<head>
    <title>CSS Basics & Selectors</title>

    <style>
        h1 {
            color: rgb(0, 174, 255);
        }

        .content {
            background-color: rgb(64, 31, 184);
            padding: 10px;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to CSS Styling</h1>

    <p class="content">
        This paragraph demonstrates background color using CSS.
    </p>

    <button id="myButton" style="font-size: 10px;">
        Click Me
    </button>

</body>
</html>
