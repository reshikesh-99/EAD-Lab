<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            background-color: #e4e010;
        }

        li {
         display: inline-flexbox;
        }

        li a {
            display: block;
            padding: 15px 20px;
            color: rgb(19, 4, 71);
            text-decoration: none;
        }

        li a:hover {
            background-color: #d11d2c;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="https://chatgpt.com/">Home</a></li>
        <li><a href="https://www.cbit.ac.in/">About</a></li>
        <li><a href="https://www.youtube.com/">Services</a></li>
        <li><a href="https://www.instagram.com/dasagriva_05/?hl=en">Contact</a></li>
    </ul>

</body>
</html>
